<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>整數勇者傳說｜勇者小屋</title>
<style>
:root{--ink:#4a2b10;--gold:#ffd24a;--wood:#c98a4b;--card:#fff8ea;--dim:#8a6a4a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#7cc36a;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
/* ===== 小屋場景 ===== */
#room{position:fixed;inset:0;overflow:hidden}
#room svg.bg{position:absolute;inset:0;width:100%;height:100%}
#room svg .tap{cursor:pointer}
#room svg .tap:hover{filter:brightness(1.12)}
#heroG{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1s ease-in-out infinite alternate}
.flame.f2{animation-duration:.8s}.flame.f3{animation-duration:1.25s}
@keyframes flame{0%{transform:scaleY(1) rotate(-4deg)}100%{transform:scaleY(1.2) rotate(4deg)}}
.md-on{filter:drop-shadow(0 0 8px #ffd24a)}
#bubbleBox{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#bubble{background:#fff;border:4px solid #a0632b;border-radius:18px;padding:10px 14px;font-weight:800;font-size:22px;line-height:1.45;color:#4a2b10;box-shadow:0 4px 0 #0002;cursor:pointer;animation:pop .4s ease-out;display:inline-block}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 頂端資訊 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.pill{background:#fff8eaee;border:3px solid #a0632b;border-radius:99px;padding:3px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #0003}
#top .sp{margin-left:auto}
#gear{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px}
/* 底部圖示 */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:clamp(6px,2vw,22px);padding:0 8px 12px;flex-wrap:nowrap}
.ic{position:relative;width:clamp(66px,13vw,118px);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0}
.ic .c{width:clamp(58px,11vw,100px);height:clamp(58px,11vw,100px);border-radius:50%;background:radial-gradient(circle at 50% 35%,#fffdf5,#fbe6c2);border:5px solid #c47a33;box-shadow:0 5px 0 #8a4f1c,0 8px 14px #0004;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,5.4vw,50px);transition:transform .12s}
.ic:active .c,.ic:hover .c{transform:translateY(-4px) scale(1.04)}
.ic .l{margin-top:-14px;background:#fff8ea;border:3px solid #c47a33;border-radius:12px;padding:1px 8px;font-weight:900;font-size:clamp(12px,2.2vw,17px);white-space:nowrap;box-shadow:0 3px 0 #8a4f1c}
.ic .n{position:absolute;right:4px;top:0;min-width:24px;height:24px;border-radius:99px;background:#e8461a;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}
.ic .n.ok{background:#2e9e5b}
.ic.soon{opacity:.75}
/* 視窗 */
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.modal.on{display:flex}
.box{background:var(--card);border:5px solid #c47a33;border-radius:22px;padding:16px 18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 8px 0 #8a4f1c,0 14px 30px #0006;color:var(--ink)}
.box.wide{max-width:720px}
.box h2{margin:0 0 8px;color:#8a4f1c}.story{background:#f3e3c5;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7;color:#5a3a1a}
.x{float:right;background:#c47a33;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:34px;padding:0}
.row{display:flex;justify-content:space-between;gap:6px;padding:7px 2px;border-bottom:2px dashed #e2c99c;font-size:15px}
.row i{font-style:normal;font-size:20px;width:28px;text-align:center}.row span{flex:1}.row em{font-style:normal;color:#b8650b;font-weight:900}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.big{border:0;border-radius:16px;padding:14px 8px;text-align:center;font-weight:800;font-size:17px;color:#fff;box-shadow:0 4px 0 #0003}
.big span{display:block;font-size:40px}.big small{display:block;font-weight:500;font-size:12px;margin-top:4px;line-height:1.5}
.teach{background:linear-gradient(#35b46a,#1f7f49)}.chal{background:linear-gradient(#e8573d,#a82a1a)}.hell{background:linear-gradient(#7a1fd1,#3b0d7a)}
.endb{display:block;width:100%;margin-top:10px;background:linear-gradient(#0e9bb8,#0b5f78)}
.inp{width:100%;font-size:22px;padding:8px;border-radius:10px;border:3px solid #c47a33;background:#fff;color:#333;margin-top:8px}
.qbox{font-size:34px;font-weight:900;text-align:center;margin:10px 0;color:#b8650b;word-break:break-all}
.two{display:grid;gap:10px;margin-top:10px}
.sbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;font-size:16px;color:#fff;background:#c47a33;box-shadow:0 4px 0 #8a4f1c}
/* 五角形地圖 */
#mapSvg{width:100%;height:auto;max-height:66vh;display:block}
.wedge{cursor:pointer;transition:filter .15s}.wedge:hover{filter:brightness(1.2)}
.wedge text{pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#0008;stroke-width:4px}
.rec{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
/* 勇者資料 */
.hero-card{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:520px){.hero-card{grid-template-columns:1fr}}
.hero-card .hfig{filter:drop-shadow(0 4px 3px #0004)}
.bar{height:16px;background:#e2c99c;border-radius:99px;overflow:hidden;border:2px solid #a0632b}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6bd68f,#2e9e5b)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stats div{background:#f3e3c5;border-radius:10px;padding:6px;text-align:center;font-weight:900}.stats small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{background:#f3e3c5;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800}
/* 遊戲畫面 */
#stage{position:fixed;inset:0;background:#000;z-index:80;display:none}#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#home{position:absolute;left:8px;top:8px;z-index:5;display:none;align-items:center;padding:0;margin:0;background:#fff8eaee;color:#4a2b10;border:3px solid #a0632b;border-radius:99px;font-size:14px;font-weight:900;box-shadow:0 3px 0 #0003;touch-action:manipulation;height:32px}
#home.show{display:flex}
#home .hd{width:28px;text-align:center;font-size:16px;line-height:1}
#home .tx{display:none;padding:0 12px 0 2px;white-space:nowrap}
#home.open .tx{display:inline}
@media (max-height:520px){#dock .ic .c{width:52px;height:52px;font-size:26px;border-width:4px}.ic .l{font-size:12px;margin-top:-10px}}
/* ===== 商店新增：房間木頭顏色、飾品動畫、分頁、預覽列 ===== */
.wd{fill:var(--wd,#7a4518)}.wds{stroke:var(--wd,#7a4518)}
.petbob{animation:petbob 2.2s ease-in-out infinite}@keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.1s ease-in-out infinite alternate}@keyframes tail{0%{transform:rotate(-10deg)}100%{transform:rotate(14deg)}}
.tw{animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{opacity:.3}}
.skin-rainbow{animation:skinrb 6s linear infinite}@keyframes skinrb{from{filter:hue-rotate(0deg) saturate(1.4) drop-shadow(0 0 8px #fff)}to{filter:hue-rotate(360deg) saturate(1.4) drop-shadow(0 0 8px #fff)}}
.tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}.tabs button{flex:1;min-width:76px;border:3px solid #c47a33;background:#fff8ea;border-radius:12px;padding:6px 4px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #8a4f1c}.tabs button.on{background:#c47a33;color:#fff}
.shopsec{margin:12px 0 2px;font-weight:900;color:#8a4f1c;font-size:15px}
.gd{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:2px dashed #e2c99c}
.gd .th{width:64px;height:64px;flex:none;border-radius:12px;background:#f3e3c5;border:2px solid #e2c99c;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px}
.gd .th svg{width:100%;height:100%}.gd .th img{height:58px}
.gd .tx{flex:1;min-width:0;font-size:14px}.gd .tx small{color:var(--dim)}
.gd .bt{display:flex;flex-direction:column;gap:5px;align-items:stretch;flex:none}
.gd .bt .sbtn{padding:6px 10px;font-size:14px;white-space:nowrap}.sbtn[disabled]{opacity:.45}
.sbtn.g{background:#2e9e5b;box-shadow:0 4px 0 #1d6b3c}.sbtn.b{background:#4b6fd6;box-shadow:0 4px 0 #2c4796}.sbtn.o{background:#e08a1e;box-shadow:0 4px 0 #9b5a0a}
.eqd{font-size:12px;font-weight:900;color:#2e7d32;text-align:center}
#pvBar{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:70;display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff8eaf5;border:4px solid #c47a33;border-radius:20px;padding:6px 12px;font-weight:900;box-shadow:0 5px 0 #0003;width:max-content;max-width:96vw;white-space:nowrap}
#pvBar.on{display:flex}#pvBar .sbtn{padding:6px 12px}
.sw{width:100%;height:100%;display:flex;flex-direction:column}.sw i{flex:3}.sw b{flex:1}

/* 讀進度：all＝通關小關數；stars＝各關最高星 */
function prog(g){
 const b=blob(g),cnt=o=>o?Object.values(o).filter(x=>x&&x.stars>0).length:0,sum=o=>o?Object.values(o).reduce((a,x)=>a+((x&&x.stars)||0),0):0;
 if(g.neg){const n=b.negativeHero||{};let P=n.P??J('negHero_P',[]);if(!Array.isArray(P))P=[];const c=P.filter(x=>x>0).length;return{all:c,stars:P.reduce((a,x)=>a+(x||0),0)}}
 let get=k=>{const v=b[k];return v?(v.stages||v.layers):null};
 let t=get(g.pk+'Teach'),c=get(g.pk);
 if(g.layers&&!stu()){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/perfect-deduct-egypt-progress/.test(k)){const v=J(k,{});if(/teach/i.test(k))t=t||v;else c=c||v}}}

 morning:{t:'早安',s0:'#ffc9a8',s1:'#fff1d6',sun:'#ffd27a',sx:90,sy:120,h1:'#8fcf73',h2:'#6cb956',cl:.85,shade:0.04,star:0,moon:0},

 evening:{t:'傍晚好',s0:'#ff8a5b',s1:'#ffd29a',sun:'#ff9e3d',sx:410,sy:150,h1:'#6a9a52',h2:'#4f7f3c',cl:.6,shade:.1,star:0,moon:0},

 space:{t:'歡迎登艦',s0:'#04061a',s1:'#1b1f4a',sun:'#c9b6ff',sx:380,sy:70,h1:'#1c2347',h2:'#141a38',cl:0,shade:.08,star:1,moon:0}};

function heroCard(){

 const total=G.reduce((a,g)=>a+chScore(g.id),0),medals=G.filter(medal).length,shards=Object.values(o.shards||{}).reduce((a,s)=>a+s.n,0);

 <div style="margin:6px 0 2px;font-weight:900">Lv.${L}　<small style="color:var(--dim)">經驗 ${li.cur} / ${li.need}</small></div><div class="bar"><i style="width:${Math.round(li.cur/li.need*100)}%"></i></div>

 <div class="chips">${titles.length?titles.map(t=>`<span>${t}</span>`).join(''):'<span>還沒有稱號：通關一章就能得到第一個！</span>'}</div></div></div>

 ${G.map(g=>{const p=prog(g),lock=g.neg&&!shield();return`<div class="row"><i>${g.sym}</i><span>${g.ch}・${g.name}${lock?'　🔒':''}</span><em>${medal(g)?'🏅 ':''}${p.all}/${g.total} 關　⭐${p.stars}　🏆${chScore(g.id)||0}</em></div>`}).join('')}
 <div class="chips" style="margin-top:10px"><span>🏆 總積分 ${total.toLocaleString()}</span><span>🏅 勳章 ${medals}/6</span><span>🧩 碎片 ${shards}</span><span>📝 錯題 ${(o.wrong||[]).length}</span></div>`)}
/* ===== 冒險地圖（五角形）===== */
function openMap(){
 const six=shield(),n=six?6:5,list=G.slice(0,n),cx=300,cy=300,R=285,rec=recommend();
 let s='<defs>'+G.map(g=>`<linearGradient id="gr-${g.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g.c[0]}"/><stop offset="1" stop-color="${g.c[1]}"/></linearGradient>`).join('')+'</defs>';
 const step=360/n;
 list.forEach((g,i)=>{
  const a0=(-90-step/2+i*step)*Math.PI/180,a1=a0+step*Math.PI/180,am=(a0+a1)/2,p=(a,r)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const A=p(a0,R),B=p(a1,R),M=p(am,R*.60),pr=prog(g),isRec=rec&&rec.id===g.id;
  s+=`<g class="wedge" data-id="${g.id}"><polygon points="${cx},${cy} ${A} ${B}" fill="url(#gr-${g.id})" stroke="#ffe9a0" stroke-width="3" stroke-linejoin="round"/>
  ${isRec?`<polygon class="rec" points="${cx},${cy} ${A} ${B}" fill="none" stroke="#fff" stroke-width="6"/>`:''}
  <text x="${M[0]}" y="${M[1]-6}" font-size="${n==5?78:70}" font-weight="900">${g.sym}</text>
  <text x="${M[0]}" y="${M[1]+22}" font-size="22" font-weight="800">${g.ch}・${g.name}</text>
  <text x="${M[0]}" y="${M[1]+48}" font-size="18">${medal(g)?'🏅':'🎯'} ${pr.all}/${g.total}　🏆 ${chScore(g.id)||'—'}</text></g>`;
 });
 s+=`<circle cx="${cx}" cy="${cy}" r="46" fill="#14163a" stroke="#ffd24a" stroke-width="4"/><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="40">${six?'🛡️':'🔒'}</text>`;
 openBox(`<h2>🗺️ 冒險地圖</h2><div style="font-size:13px;color:var(--dim)">點一塊島嶼進入那一章。閃動白框＝建議你下一站去的地方。</div><svg id="mapSvg" viewBox="0 0 600 600">${s}</svg>
 ${six?'':'<button class="sbtn" style="display:block;margin:6px auto 0;background:#5e2bb5;box-shadow:0 4px 0 #2a1650" onclick="open(\'neg\')">🌀 深淵之門（第六章・負數）</button>'}`,true);

}
function open(id){

 <div class="story">${g.story}<br>🏅 <b>${g.medal}</b>：${g.eff}　（已通 ${pr.all}/${g.total} 關）</div>
 <button class="big chal" style="width:100%;margin-top:14px;background:linear-gradient(#f0a03c,#c4651a)" onclick="go('${id}','quick')"><span>⚔️</span>進入${g.ch}<small>在地圖上點選關卡後，再選擇 🎓教學／⚔️挑戰／🔥地獄</small></button>
 ${(!g.neg&&medal(g))?`<button class="big endb" onclick="go('${id}','quick',1)">♾️ 章節無限模式<small>整章隨機怪物，打倒才結算經驗</small></button>`:(g.neg?'':'<div style="text-align:center;color:var(--dim);font-size:13px;margin-top:10px">🔒 通關整章後開啟「♾️ 章節無限模式」；各大關的無限練習在遊戲地圖左上角</div>')}`);
}

function go(id,m,endless){

/* 「回勇者小屋」平常縮在左側邊，只露出一個小把手；點一下把手滑出來，再點一下文字才真的回去（避免小朋友誤觸），4 秒沒動作自動縮回去 */
let homeT=0;
function homeShut(){clearTimeout(homeT);$('#home').classList.remove('open')}
function homeOpen(){$('#home').classList.add('open');clearTimeout(homeT);homeT=setTimeout(homeShut,4000)}
setInterval(()=>{
 const h=$('#home');if(!$('#stage').classList.contains('on')){h.classList.remove('show');return}
 let on=true;try{const d=$('#fr').contentDocument,m=d.getElementById('map-screen'),mn=d.getElementById('menu');
  if(m)on=!m.classList.contains('hidden')&&d.defaultView.getComputedStyle(m).display!=='none';
  else if(mn)on=!mn.hidden&&d.defaultView.getComputedStyle(mn).display!=='none'}catch(e){}
 h.classList.toggle('show',on);if(!on)homeShut()},300);
$('#home').onclick=e=>{
 const h=$('#home');
 if(!h.classList.contains('open')){homeOpen();return}
 if(e.target.closest('.hd')){homeShut();return}
 homeShut();$('#fr').src='about:blank';$('#stage').classList.remove('on');render()};

 if(perm){o2.own=o2.own||{};o2.own[id]=1;o2.equip=o2.equip||{};o2.equip[x.slot]=id;saveRK(o2);render();
  openShop(`✅ 購買成功！「${x.name}」已經自動換上，回小屋看看吧～`)}
 else{o2.items=o2.items||{};o2.items[id]=(o2.items[id]||0)+1;if(id!=='rename'){const b=buyToday(o2);b.n[id]=(b.n[id]||0)+1}saveRK(o2);render();
  if(id==='rename')useItem('rename');else openShop(`✅ 購買成功！${x.icon} ${x.name} ×${o2.items[id]}`)}}
function setEquip(slot,id){const o=RK();o.equip=o.equip||{};if(id)o.equip[slot]=id;else delete o.equip[slot];saveRK(o);render();openShop()}
/* 試用：先在小屋上看看效果，喜歡再買 */
function preview(id){const x=IT.find(id);if(!x)return;PREV={slot:x.slot,id};$('#mm').classList.remove('on');applyLook();
 const owned=priceOf(id)===0||own()[id];
 $('#pvBar').innerHTML=`<span>👀 試用中：${x.icon} ${esc(x.name)}</span>${owned?'':`<button class="sbtn o" id="pvBuy">🪙 ${priceOf(id)} 買下</button>`}<button class="sbtn" id="pvBack">↩ 回商店</button>`;
 $('#pvBar').classList.add('on');$('#pvBack').onclick=()=>endPreview();if($('#pvBuy'))$('#pvBuy').onclick=()=>{endPreview(true);buy(id)}}
function endPreview(silent){PREV=null;$('#pvBar').classList.remove('on');applyLook();if(!silent)openShop()}
function useItem(id){if(id==='rename'){if(!((RK().items||{}).rename>0)){openShop('❌ 沒有改名卡');return}askName(false)}}
/* ===== 老師用：商店與經濟數據（掃描這台電腦上所有學生的存檔）===== */
function openShopStats(){
 const rows=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('heroRPG_v1:')){try{rows.push([k.slice(11),JSON.parse(localStorage.getItem(k))||{}])}catch(e){}}}
 const buy={},use={},have={};let spent=0,coins=0,buyers=0;
 rows.forEach(([n,o])=>{const s=o.stat||{};spent+=s.spent||0;coins+=o.coin||0;if(s.spent>0)buyers++;for(const k in (s.buy||{}))buy[k]=(buy[k]||0)+s.buy[k];for(const k in (s.use||{}))use[k]=(use[k]||0)+s.use[k];for(const k in (o.own||{}))have[k]=(have[k]||0)+1});
 const nm=id=>{const x=id==='rename'?RENAME:IT.find(id);return x?x.icon+' '+x.name:id};
 const tb=(m,t)=>{const k=Object.keys(m).sort((a,b)=>m[b]-m[a]);return k.length?k.map(i=>`<div class="row"><span>${nm(i)}</span><em>${m[i]} ${t}</em></div>`).join(''):'<div style="color:var(--dim);font-size:13px">（還沒有資料）</div>'};
 const n=rows.length||1;
 openBox(`<h2>📊 商店與經濟數據</h2><div class="story">只統計「這台電腦／這個瀏覽器」裡的存檔，共 <b>${rows.length}</b> 位學生（含訪客）。<br>累計賺到約 <b>${(coins+spent).toLocaleString()}</b> 枚、已花掉 <b>${spent.toLocaleString()}</b> 枚（花掉 ${coins+spent?Math.round(spent/(coins+spent)*100):0}%）、目前存款平均 <b>${Math.round(coins/n)}</b> 枚。有買過東西的學生：<b>${buyers}</b> 位。<br><small>花掉比例太低＝商品不夠吸引或太貴；太高＝可以考慮調漲價格。價格可在 hero-config.js 的 shop 裡調整。</small></div>
 <h3 style="margin:12px 0 2px;color:#8a4f1c">🛒 購買次數</h3>${tb(buy,'次')}
 <h3 style="margin:12px 0 2px;color:#8a4f1c">⚔️ 戰鬥中使用次數</h3>${tb(use,'次')}
 <h3 style="margin:12px 0 2px;color:#8a4f1c">🎨 造型／飾品擁有人數</h3>${tb(have,'人')}`,true)}
/* ===== 設定（玩法、教師版、重置）===== */
const TFILES=[['第一章 加法','addition-teacher.html'],['第二章 減法','subtraction-teacher.html'],['第三章 乘法','multiplication-teacher.html'],['第四章 除法','division-teacher.html'],['第五章 四則','four-ops-teacher.html'],['第六章 負數','negative-teacher.html']];
function openTeacherList(){
 openBox(`<h2>👩‍🏫 教師測試版</h2><div class="story">獨立存檔，不會影響學生資料。可以解鎖全部關卡、一鍵通關、設定等級、自動答題、直接過關、直接進入任意關卡。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">${TFILES.map(([n,f])=>`<button class="big endb" style="margin:0;font-size:16px;padding:12px 4px" onclick="openTeacher('${f}')">${n}</button>`).join('')}</div><button class="big endb" style="background:linear-gradient(#e08a1e,#9b5a0a)" onclick="openShopStats()">📊 商店與經濟數據</button><button class="big endb" style="background:linear-gradient(#7a5ad6,#4b2fa0)" onclick="openTuner()">🎯 配件位置調整器</button>`)}
/* ===== 老師用：配件位置調整器（披風、帽子位置不對時，在這裡拖滑桿，再把數字貼進 hero-items.js 的 ANCHORS）===== */
let TU={ch:'default',id:'g_crown'};
function openTuner(ch,id){
 if(ch)TU.ch=ch;if(id)TU.id=id;const it=IT.find(TU.id),a=IT.anchorOf(it,TU.ch);
 const e={skin:TU.ch==='default'?'default':TU.ch};e[it.slot]=TU.id;
 const sl=(k,mn,mx,st)=>`<label style="display:block;font-weight:800;margin:6px 0">${{cx:'左右',cy:'上下',w:'大小'}[k]}：<b id="tv_${k}">${a[k]}</b><input type="range" min="${mn}" max="${mx}" step="${st}" value="${a[k]}" oninput="tuneSet('${k}',this.value)" style="width:100%"></label>`;
 openBox(`<h2>🎯 配件位置調整器</h2><div class="story"><small>選角色和配件，拖滑桿到剛剛好，再把下面那行複製貼到 hero-items.js 最下面的 ANCHORS 裡。</small></div>
 <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap"><select onchange="openTuner(this.value)" style="font-size:16px;padding:6px">${['default'].concat(IT.charIds).map(c=>`<option value="${c}" ${c===TU.ch?'selected':''}>${c==='default'?'原版勇者':IT.find(c).name}</option>`).join('')}</select>
 <select onchange="openTuner(null,this.value)" style="font-size:16px;padding:6px">${IT.gear.map(g=>`<option value="${g.id}" ${g.id===TU.id?'selected':''}>${g.icon} ${g.name}</option>`).join('')}</select></div>
 <div id="tuneFig" style="text-align:center;background:#f3e3c5;border-radius:12px;padding:8px">${heroFig(e,260)}</div>${sl('cx',0,1,.005)}${sl('cy',-.1,1.1,.005)}${sl('w',.05,1.2,.005)}
 <textarea id="tuneOut" readonly onclick="this.select()" style="width:100%;height:60px;font:13px monospace;margin-top:6px"></textarea>`,true);tuneOut()}
function tuneSet(k,v){const it=IT.find(TU.id),t=IT.ANCHORS[TU.ch]=IT.ANCHORS[TU.ch]||{},c=t[TU.id]=Object.assign({},IT.anchorOf(it,TU.ch),t[TU.id]);c[k]=+v;$('#tv_'+k).textContent=v;
 const e={skin:TU.ch};e[it.slot]=TU.id;$('#tuneFig').innerHTML=heroFig(e,260);tuneOut()}
function tuneOut(){const it=IT.find(TU.id),a=IT.anchorOf(it,TU.ch);$('#tuneOut').value=`${TU.ch}:{ ${TU.id}:{cx:${a.cx},cy:${a.cy},w:${a.w}} },`}
function openTeacher(f){$('#mm').classList.remove('on');$('#fr').src=encodeURI(f);$('#stage').classList.add('on');homeShut()}
function askTeacher(){if(TEACHER_PASS){const v=prompt('請輸入教師密碼');if(v!==TEACHER_PASS){if(v!==null)alert('密碼不對喔');return}}openTeacherList()}
function openHow(){openBox(`<h2>📜 玩法說明</h2><div class="story">1. 點桌上的<b>冒險地圖</b>（或下面的 🗺️），選一塊島嶼進入那一章，不用照順序。<br>2. 在章節地圖點一個關卡後，再選擇 🎓教學（小老師教你，最高 ⭐2）、⚔️挑戰（最高 ⭐4）或 🔥地獄（最高 ⭐5），三種進度共用。<br>3. 前五章都通關，牆上的勳章架會亮滿，煉成🛡️平衡之神盾，第六章「負數」正式開啟。<br>4. 不知道去哪？看勇者頭上的對話泡泡，或打開 📜今日任務。<br>5. 通關一個大關，遊戲地圖左上角會開啟「♾️無限練習」；整章通關後，冒險地圖也會出現「♾️章節無限模式」。<br>6. 答錯的題目會收集到 📝錯題練習，同一題答對 ${GRAD} 次就畢業。<br>7. 點勇者可以看自己的能力、稱號和冒險紀錄，想改名字要到 🏪商店 買「改名卡」；商店還有血瓶、復活藥、防禦盾、積分券，以及勇者造型、小屋背景和房間飾品，買了會自動換上，也能隨時換回來。<br>8. 每場戰鬥結束會得到 🪙勇者幣：答對越多、關卡越後面、模式越難、星星越多，賺得越多；第一次通關還有大獎！</div>`)}
function openGear(){openBox(`<h2>⚙️ 設定</h2><div style="display:grid;gap:10px"><button class="sbtn" onclick="openHow()">📜 玩法說明</button><button class="sbtn" style="background:#4b5563;box-shadow:0 4px 0 #2b3038" onclick="askTeacher()">👩‍🏫 教師測試版</button></div>`)}
/* ===== 綁定 ===== */
$('#heroWrap').onclick=heroCard;$('#lvPill').onclick=heroCard;$('#bubble').onclick=()=>{const r=recommend();if(tipI%TIPS.length===1&&r)openMap();else heroCard()};
$('#mapTableG').onclick=openMap;$('#medals').onclick=heroCard;
$('#icDaily').onclick=openDaily;$('#icMap').onclick=openMap;$('#icBoard').onclick=openBoard;$('#icWrong').onclick=openWrong;$('#icBag').onclick=openBag;$('#icShop').onclick=()=>openShop();
$('#gear').onclick=openGear;$('#coinPill').onclick=()=>openShop();$('#scorePill').onclick=openBoard;
$('#mm').onclick=e=>{if(e.target.id==='mm')shut()};
render();preloadShop();
if(!RK().name)askName(true);
