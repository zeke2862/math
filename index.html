<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#7cc36a"><link rel="manifest" href="./manifest.webmanifest">
<title>整數勇者傳說｜勇者小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#321d0d;--gold:#ffd24a;--wood:#8c5626;--card:#fdf9f0;--dim:#7d5c3f;--gold-border:#c59b48;--deep-gold:#946f28}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#181008;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
/* ===== 小屋場景 ===== */
#room{position:fixed;inset:0;overflow:hidden;background:#140c06}
#room svg.bg{position:absolute;inset:0;width:100%;height:100%}
#room svg .tap{cursor:pointer}
#room svg .tap:hover{filter:brightness(1.18) drop-shadow(0 0 10px rgba(255,215,0,0.5))}
#heroG{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1s ease-in-out infinite alternate}
.flame.f2{animation-duration:.8s}.flame.f3{animation-duration:1.25s}
@keyframes flame{0%{transform:scaleY(1) rotate(-4deg)}100%{transform:scaleY(1.2) rotate(4deg)}}
.md-on{filter:drop-shadow(0 0 8px #ffd24a)}
#bubbleBox{font-family:"Noto Serif TC","Noto Sans TC","Microsoft JhengHei",serif}
#bubble{background:linear-gradient(135deg,#fffef8 0%,#fbf2dc 100%);border:3px solid #b38843;border-radius:18px;padding:12px 16px;font-weight:900;font-size:21px;line-height:1.45;color:#3b1e07;box-shadow:0 6px 0 #522d0d,0 12px 24px rgba(0,0,0,0.45);cursor:pointer;animation:pop .4s ease-out;display:inline-block}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 頂端資訊 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(20,12,6,0.65) 0%,rgba(20,12,6,0) 100%);pointer-events:none}
#top > *{pointer-events:auto}
.pill{background:linear-gradient(180deg,#fffdf7 0%,#faecd2 100%);border:2px solid #b88636;border-radius:99px;padding:4px 14px;font-weight:900;font-size:15px;color:#3e1f06;box-shadow:0 4px 10px rgba(0,0,0,0.35),inset 0 1px 0 #fff;font-family:'Noto Serif TC','Noto Sans TC',serif;letter-spacing:0.5px}
#top .sp{margin-left:auto}
#gear{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center}
/* 底部圖示（精緻青銅金鑲玉徽章風格） */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:clamp(8px,2.2vw,24px);padding:0 8px 12px;flex-wrap:nowrap;background:linear-gradient(0deg,rgba(16,9,4,0.75) 0%,rgba(16,9,4,0) 100%)}
.ic{position:relative;width:clamp(66px,13vw,118px);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.ic .c{width:clamp(58px,11vw,100px);height:clamp(58px,11vw,100px);border-radius:50%;background:radial-gradient(circle at 45% 35%,#fffdf5 0%,#f9e5be 55%,#deb173 100%);border:3.5px solid #c59b48;outline:2px solid #4a290c;box-shadow:0 6px 0 #3b1e06,0 10px 20px rgba(0,0,0,0.55),inset 0 2px 4px rgba(255,255,255,0.9),inset 0 -3px 6px rgba(100,50,10,0.35);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,5.4vw,50px);transition:transform .15s cubic-bezier(0.18,0.89,0.32,1.28),box-shadow .15s,border-color .15s}
.ic:hover .c,.ic:active .c{transform:translateY(-6px) scale(1.06);box-shadow:0 10px 0 #3b1e06,0 14px 26px rgba(0,0,0,0.65),inset 0 2px 4px rgba(255,255,255,1);border-color:#ffd966}
.ic-img{width:76%;height:76%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.45));transition:transform .18s cubic-bezier(0.18,0.89,0.32,1.28)}
.ic:hover .ic-img{transform:scale(1.12)}
.ic .l{margin-top:-14px;background:linear-gradient(180deg,#3d210d 0%,#241205 100%);color:#faecd2;border:2px solid #c59b48;border-radius:12px;padding:2px 10px;font-weight:900;font-size:clamp(12px,2.2vw,16px);white-space:nowrap;box-shadow:0 3px 0 #140902,0 4px 10px rgba(0,0,0,0.5);text-shadow:0 1px 2px rgba(0,0,0,0.9);font-family:'Noto Serif TC','Songti TC','Noto Sans TC',serif;letter-spacing:0.5px}
.ic .n{position:absolute;right:4px;top:0;min-width:24px;height:24px;border-radius:99px;background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,0.4)}
.ic .n.ok{background:linear-gradient(180deg,#22c55e,#15803d)}
.ic.soon{opacity:.75}
/* 視窗（古風卷軸與重彩 parchment 質感） */
.modal{position:fixed;inset:0;background:rgba(12,6,2,0.82);display:none;align-items:center;justify-content:center;z-index:50;padding:12px;backdrop-filter:blur(3px)}.modal.on{display:flex}
.box{background:linear-gradient(135deg,#fffdf8 0%,#fbf2df 100%);border:4px solid #9e6d2b;outline:2px solid #4a290c;border-radius:20px;padding:18px 22px;max-width:580px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 0 #3a1e07,0 18px 45px rgba(0,0,0,0.75),inset 0 1px 0 rgba(255,255,255,0.9);color:var(--ink)}
.box.wide{max-width:740px}
.box h2{margin:0 0 10px;color:#4a2406;font-family:'Noto Serif TC','Songti TC',serif;font-size:24px;border-bottom:2px solid #d4b276;padding-bottom:8px;display:flex;align-items:center;gap:8px}
.story{background:#f6e9cc;border:1.5px solid #d9b87f;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.75;color:#432408;font-family:'Noto Serif TC','Noto Sans TC',serif}
.x{float:right;background:linear-gradient(180deg,#a25e1a,#733d0a);color:#faecd2;border:2px solid #d4af37;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:30px;padding:0;box-shadow:0 3px 0 #411e03}
.row{display:flex;justify-content:space-between;gap:6px;padding:8px 4px;border-bottom:1.5px dashed #dbc292;font-size:15px}
.row i{font-style:normal;font-size:20px;width:28px;text-align:center}.row span{flex:1}.row em{font-style:normal;color:#b8650b;font-weight:900}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.big{border:2px solid rgba(255,255,255,0.6);border-radius:16px;padding:14px 8px;text-align:center;font-weight:900;font-size:17px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,0.4),0 8px 16px rgba(0,0,0,0.25);text-shadow:0 1px 3px rgba(0,0,0,0.6)}
.big span{display:block;font-size:40px}.big small{display:block;font-weight:600;font-size:12px;margin-top:4px;line-height:1.5}
.teach{background:linear-gradient(180deg,#22c55e,#15803d)}.chal{background:linear-gradient(180deg,#f97316,#c2410c)}.hell{background:linear-gradient(180deg,#a855f7,#6b21a8)}
.endb{display:block;width:100%;margin-top:10px;background:linear-gradient(180deg,#0ea5e9,#0369a1)}
.inp{width:100%;font-size:22px;padding:10px;border-radius:12px;border:3px solid #b38843;background:#fff;color:#333;margin-top:8px}
.qbox{font-size:34px;font-weight:900;text-align:center;margin:10px 0;color:#9a4a06;word-break:break-all}
.two{display:grid;gap:10px;margin-top:10px}
.sbtn{border:2px solid #fedb72;outline:1.5px solid #5a320c;border-radius:12px;padding:10px 16px;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#d97706,#b45309);box-shadow:0 4px 0 #5f2b03,0 6px 12px rgba(0,0,0,0.3);text-shadow:0 1px 2px rgba(0,0,0,0.6);transition:all .12s}
.sbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #5f2b03}
.sbtn[disabled]{opacity:.5;filter:grayscale(0.6)}
.sbtn.g{background:linear-gradient(180deg,#16a34a,#15803d);box-shadow:0 4px 0 #0f4d22}
.sbtn.b{background:linear-gradient(180deg,#2563eb,#1d4ed8);box-shadow:0 4px 0 #123385}
.sbtn.o{background:linear-gradient(180deg,#ea580c,#c2410c);box-shadow:0 4px 0 #6d2003}
/* 五角形地圖 */
#wmap{position:relative;aspect-ratio:1600/1100;background:#e9d8b0;margin-top:8px;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px #0006;line-height:0}#wmap img{width:100%;height:auto;display:block;user-select:none}
.wn{position:absolute;transform:translate(-50%,-100%);border:2px solid #d4af37;border-radius:14px;background:linear-gradient(180deg,#3d210d,#241205);color:#faecd2;padding:3px 9px 4px;line-height:1.25;cursor:pointer;text-align:center;box-shadow:0 3px 8px #0008;font-family:'Noto Serif TC','Noto Sans TC',serif;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:0;transition:transform .12s}
.wn:hover{transform:translate(-50%,-104%) scale(1.06)}.wn i{font-style:normal;font-weight:900;font-size:clamp(16px,3.2vw,26px);width:1.5em;height:1.5em;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;margin-top:-1.1em;border:2px solid #ffe9a0;color:#fff;text-shadow:0 1px 2px #0008}
.wn b{font-size:clamp(11px,1.9vw,15px)}.wn small{font-size:clamp(9px,1.5vw,12px);opacity:.9}.wn.lk{filter:saturate(.5)}@media (max-width:600px){.wn small{display:none}.wn{padding:2px 6px 3px}.wn i{font-size:15px;margin-top:-.9em}.wn b{font-size:10px}}
.wn.rec{animation:wnp 1.6s ease-in-out infinite}@keyframes wnp{50%{box-shadow:0 0 0 6px #ffd96655,0 0 18px #ffd966}}
/* 勇者資料 */
.hero-card{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:520px){.hero-card{grid-template-columns:1fr}}
.hero-card .hfig{filter:drop-shadow(0 6px 10px rgba(0,0,0,0.45))}
.bar{height:18px;background:#e5cda2;border-radius:99px;overflow:hidden;border:2px solid #8c5a24}.bar i{display:block;height:100%;background:linear-gradient(90deg,#86efac,#16a34a)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stats div{background:#f6e9cc;border:1.5px solid #d9b87f;border-radius:10px;padding:6px;text-align:center;font-weight:900}.stats small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{background:#f6e9cc;border:1.5px solid #d9b87f;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800;color:#4a2707}
/* 遊戲畫面 */
#stage{position:fixed;inset:0;background:#000;z-index:80;display:none}#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#home{position:absolute;left:8px;top:120px;z-index:5;display:none;align-items:center;padding:0;margin:0;background:linear-gradient(180deg,#fffdf7,#faecd2);color:#3e1f06;border:2px solid #b88636;border-radius:99px;font-size:14px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,0.35);touch-action:manipulation;height:34px;font-family:'Noto Serif TC','Noto Sans TC',serif}
#home.show{display:flex}
@media(max-height:480px){#home{top:116px}}
#home .hd{width:28px;text-align:center;font-size:16px;line-height:1}
#home .tx{display:none;padding:0 12px 0 2px;white-space:nowrap}
#home.open .tx{display:inline}
@media (max-height:520px){#dock .ic .c{width:52px;height:52px;font-size:26px;border-width:3px}.ic .l{font-size:12px;margin-top:-10px}}
/* ===== 商店新增：分頁、商品卡、品質光環 ===== */
.wd{fill:var(--wd,#7a4518)}.wds{stroke:var(--wd,#7a4518)}
.petbob{animation:petbob 2.2s ease-in-out infinite}@keyframes petbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.1s ease-in-out infinite alternate}@keyframes tail{0%{transform:rotate(-10deg)}100%{transform:rotate(14deg)}}
.tw{animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{opacity:.3}}
.skin-rainbow{animation:skinrb 6s linear infinite}@keyframes skinrb{from{filter:hue-rotate(0deg) saturate(1.4) drop-shadow(0 0 8px #fff)}to{filter:hue-rotate(360deg) saturate(1.4) drop-shadow(0 0 8px #fff)}}
.tabs{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}.tabs button{flex:1;min-width:80px;border:2px solid #b88636;background:#fffcf5;border-radius:12px;padding:8px 4px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #522d0d;color:#3b1e07;font-family:'Noto Serif TC','Noto Sans TC',serif}.tabs button.on{background:linear-gradient(180deg,#b45309,#78350f);color:#faecd2;border-color:#ffd54f}
.shopsec{margin:14px 0 4px;font-weight:900;color:#522806;font-size:16px;font-family:'Noto Serif TC','Songti TC',serif;border-left:4px solid #b45309;padding-left:8px}
.gd{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1.5px dashed #dec89e;border-radius:10px;transition:background .15s}
.gd:hover{background:rgba(217,119,6,0.06)}
.gd.r-common{border-left:4px solid #84cc16}
.gd.r-rare{border-left:4px solid #0ea5e9}
.gd.r-epic{border-left:4px solid #a855f7}
.gd.r-legend{border-left:4px solid #eab308;background:rgba(234,179,8,0.05)}
.gd .th{width:64px;height:64px;flex:none;border-radius:14px;background:#fbf3e0;border:2.5px solid #d4b276;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.gd .th.th-legend{background:radial-gradient(circle,#fffbf0 30%,#fed7aa 100%);border-color:#eab308;box-shadow:0 0 8px rgba(234,179,8,0.4)}
.gd .th.th-epic{background:radial-gradient(circle,#faf5ff 30%,#e9d5ff 100%);border-color:#c084fc;box-shadow:0 0 8px rgba(168,85,247,0.35)}
.gd .th.th-rare{background:radial-gradient(circle,#f0f9ff 30%,#bae6fd 100%);border-color:#38bdf8}
.gd .th svg{width:100%;height:100%}.gd .th img{height:58px}
.gd .tx{flex:1;min-width:0;font-size:14px;color:#351a05}.gd .tx small{color:#78583c;display:inline-block;margin-top:2px;line-height:1.4}
.it-name{font-size:15px;color:#3b1e06;font-family:'Noto Serif TC','Noto Sans TC',serif}
.it-sub{font-size:13px;font-weight:700;color:#946338}
.gd .bt{display:flex;flex-direction:column;gap:5px;align-items:stretch;flex:none}
.gd .bt .sbtn{padding:7px 12px;font-size:14px;white-space:nowrap}
.eqd{font-size:13px;font-weight:900;color:#15803d;text-align:center}
#pvBar{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:70;display:none;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(180deg,#fffdf7,#faecd2);border:3px solid #b88636;border-radius:20px;padding:8px 16px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,0.4);width:max-content;max-width:96vw;white-space:nowrap;font-family:'Noto Serif TC','Noto Sans TC',serif}
#pvBar.on{display:flex}#pvBar .sbtn{padding:6px 14px}
</style></head><body>

 <button class="ic" id="icDaily"><span class="c"><img src="./assets/shop/ui/ic_daily.png" class="ic-img" alt="今日懸賞"></span><span class="l">今日懸賞</span><span class="n" id="nDaily">!</span></button>
 <button class="ic" id="icMap"><span class="c"><img src="./assets/shop/ui/ic_map.png" class="ic-img" alt="歷練地圖"></span><span class="l">歷練地圖</span></button>
 <button class="ic" id="icBoard"><span class="c"><img src="./assets/shop/ui/ic_board.png" class="ic-img" alt="封神金榜"></span><span class="l">封神金榜</span></button>
 <button class="ic" id="icWrong"><span class="c"><img src="./assets/shop/ui/ic_wrong.png" class="ic-img" alt="悟道心齋"></span><span class="l">悟道心齋</span><span class="n" id="nWrong" style="display:none"></span></button>
 <button class="ic" id="icBag"><span class="c"><img src="./assets/shop/ui/ic_bag.png" class="ic-img" alt="百寶錦囊"></span><span class="l">百寶錦囊</span></button>
 <button class="ic" id="icShop"><span class="c"><img src="./assets/shop/ui/ic_shop.png" class="ic-img" alt="萬寶商閣"></span><span class="l">萬寶商閣</span></button>

function wEval(s){
 const t=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/[\[（]/g,'(').replace(/[\]）]/g,')');

 function expr(){let v=term();for(;;){ws();const c=t[i];if(c==='+'){i++;v+=term()}else if(c==='-'){i++;v-=term()}else return v}}
 function term(){let v=unary();for(;;){ws();const c=t[i];if(c==='*'){i++;v*=unary()}else if(c==='/'){i++;const d=unary();if(d===0||v%d!==0)bad();v/=d}else return v}}
 function unary(){ws();if(t[i]==='-'){i++;return -unary()}if(t[i]==='+'){i++;return unary()}return atom()}

const wRnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),wDig=n=>String(Math.abs(n)).length;

function wCarry(a,b,sub){let c=0;while(a>0||b>0){const x=a%10,y=b%10;if(sub?x<y+c:x+y+c>9){c=1}else c=0;if(c)return true;a=Math.floor(a/10);b=Math.floor(b/10)}return false}
function variantOf(it,avoid){
 const src=String(it.q||''),body=src.replace(/=\s*\?.*$/,'').trim(),tail=(src.slice(body.length).trim())||'= ?';

 if(dm){ /* 除法：先決定除數、商、餘數，再倒推被除數，保證出得出來 */
  if(it.r==null)return null;
  const n=+dm[1],d=+dm[2],q0=Math.floor(n/d),r0=n%d;
  for(let t=0;t<200;t++){const d2=wLike(String(d)),q2=q0>=10?wRnd(Math.pow(10,wDig(q0)-1),Math.pow(10,wDig(q0))-1):wRnd(1,9);
   const r2=r0===0?0:wRnd(1,Math.max(1,d2-1));if(d2<2||r2>=d2)continue;
   const n2=d2*q2+r2,txt=`${n2} ÷ ${d2}`;if(wDig(n2)!==wDig(n)||same(txt))continue;
   return{q:txt+' '+tail,a:q2,r:r2,v:1}}
  return null}
 const toks=[...body.matchAll(/\d+/g)].map(m=>({i:m.index,e:m.index+m[0].length,s:m[0]}));
 const sm=/^(\d+)\s*([+\-−])\s*(\d+)$/.exec(body),carry0=sm?wCarry(+sm[1],+sm[3],sm[2]!=='+'):null;
 const divs=[];for(let p=0;p<body.length;p++)if(body[p]==='÷'){
  const L=toks.findIndex(k=>k.e<=p&&/^\s*$/.test(body.slice(k.e,p))),R=toks.findIndex(k=>k.i>p&&/^[\s(\[\-−]*$/.test(body.slice(p+1,k.i)));
  if(L>=0&&R>=0){const lv=+toks[L].s,rv=+toks[R].s;divs.push({L,R,qd:rv?Math.max(1,wDig(Math.floor(lv/rv))):1})}}
 for(let t=0;t<500;t++){
  const nv=toks.map(k=>wLike(k.s));
  divs.forEach(d=>{if(nv[d.R]<1)nv[d.R]=wRnd(2,9);const q=d.qd>=2?wRnd(Math.pow(10,d.qd-1),Math.pow(10,d.qd)-1):wRnd(1,9);nv[d.L]=nv[d.R]*q});

function openGear(){openBox(`<h2>⚙️ 設定</h2><div style="display:grid;gap:10px"><button class="sbtn" onclick="openHow()">📜 玩法說明</button><button class="sbtn" style="background:#4b5563;box-shadow:0 4px 0 #2b3038" onclick="askTeacher()">👩‍🏫 教師測試版</button></div>`)}
