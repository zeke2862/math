<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整數勇者傳說｜勇者小屋</title>
<style>
:root{--ink:#4a2b10;--gold:#ffd24a;--wood:#c98a4b;--card:#fff8ea;--dim:#8a6a4a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#7cc36a;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
/* ===== 小屋場景 ===== */
#room{position:fixed;inset:0;overflow:hidden}
#room svg.bg{position:absolute;inset:0;width:100%;height:100%}
#room svg .tap{cursor:pointer}
#room svg .tap:hover{filter:brightness(1.12)}
#heroG{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1s ease-in-out infinite alternate}
.flame.f2{animation-duration:.8s}.flame.f3{animation-duration:1.25s}
@keyframes flame{0%{transform:scaleY(1) rotate(-4deg)}100%{transform:scaleY(1.2) rotate(4deg)}}
.md-on{filter:drop-shadow(0 0 8px #ffd24a)}
#bubbleBox{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#bubble{background:#fff;border:4px solid #a0632b;border-radius:18px;padding:10px 14px;font-weight:800;font-size:22px;line-height:1.45;color:#4a2b10;box-shadow:0 4px 0 #0002;cursor:pointer;animation:pop .4s ease-out;display:inline-block}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* 頂端資訊 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap}
.pill{background:#fff8eaee;border:3px solid #a0632b;border-radius:99px;padding:3px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #0003}
#top .sp{margin-left:auto}
#gear{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px}
/* 底部圖示 */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:clamp(6px,2vw,22px);padding:0 8px 12px;flex-wrap:nowrap}
.ic{position:relative;width:clamp(66px,13vw,118px);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0}
.ic .c{width:clamp(58px,11vw,100px);height:clamp(58px,11vw,100px);border-radius:50%;background:radial-gradient(circle at 50% 35%,#fffdf5,#fbe6c2);border:5px solid #c47a33;box-shadow:0 5px 0 #8a4f1c,0 8px 14px #0004;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,5.4vw,50px);transition:transform .12s}
.ic:active .c,.ic:hover .c{transform:translateY(-4px) scale(1.04)}
.ic .l{margin-top:-14px;background:#fff8ea;border:3px solid #c47a33;border-radius:12px;padding:1px 8px;font-weight:900;font-size:clamp(12px,2.2vw,17px);white-space:nowrap;box-shadow:0 3px 0 #8a4f1c}
.ic .n{position:absolute;right:4px;top:0;min-width:24px;height:24px;border-radius:99px;background:#e8461a;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}
.ic .n.ok{background:#2e9e5b}
.ic.soon{opacity:.75}
/* 視窗 */
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.modal.on{display:flex}
.box{background:var(--card);border:5px solid #c47a33;border-radius:22px;padding:16px 18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 8px 0 #8a4f1c,0 14px 30px #0006;color:var(--ink)}
.box.wide{max-width:720px}
.box h2{margin:0 0 8px;color:#8a4f1c}.story{background:#f3e3c5;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.7;color:#5a3a1a}
.x{float:right;background:#c47a33;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:34px;padding:0}
.row{display:flex;justify-content:space-between;gap:6px;padding:7px 2px;border-bottom:2px dashed #e2c99c;font-size:15px}
.row i{font-style:normal;font-size:20px;width:28px;text-align:center}.row span{flex:1}.row em{font-style:normal;color:#b8650b;font-weight:900}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.big{border:0;border-radius:16px;padding:14px 8px;text-align:center;font-weight:800;font-size:17px;color:#fff;box-shadow:0 4px 0 #0003}
.big span{display:block;font-size:40px}.big small{display:block;font-weight:500;font-size:12px;margin-top:4px;line-height:1.5}
.teach{background:linear-gradient(#35b46a,#1f7f49)}.chal{background:linear-gradient(#e8573d,#a82a1a)}.hell{background:linear-gradient(#7a1fd1,#3b0d7a)}
.endb{display:block;width:100%;margin-top:10px;background:linear-gradient(#0e9bb8,#0b5f78)}
.inp{width:100%;font-size:22px;padding:8px;border-radius:10px;border:3px solid #c47a33;background:#fff;color:#333;margin-top:8px}
.qbox{font-size:34px;font-weight:900;text-align:center;margin:10px 0;color:#b8650b;word-break:break-all}
.two{display:grid;gap:10px;margin-top:10px}
.sbtn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;font-size:16px;color:#fff;background:#c47a33;box-shadow:0 4px 0 #8a4f1c}
/* 五角形地圖 */
#mapSvg{width:100%;height:auto;max-height:66vh;display:block}
.wedge{cursor:pointer;transition:filter .15s}.wedge:hover{filter:brightness(1.2)}
.wedge text{pointer-events:none;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#0008;stroke-width:4px}
.rec{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.5}}
/* 勇者資料 */
.hero-card{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:520px){.hero-card{grid-template-columns:1fr}.hero-card img{margin:0 auto}}
.hero-card img{height:170px;filter:drop-shadow(0 4px 3px #0004)}
.bar{height:16px;background:#e2c99c;border-radius:99px;overflow:hidden;border:2px solid #a0632b}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6bd68f,#2e9e5b)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stats div{background:#f3e3c5;border-radius:10px;padding:6px;text-align:center;font-weight:900}.stats small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{background:#f3e3c5;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800}
/* 遊戲畫面 */
#stage{position:fixed;inset:0;background:#000;z-index:80;display:none}#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#home{position:absolute;left:6px;bottom:6px;z-index:5;opacity:.88;background:#fff8ea;color:#4a2b10;border:3px solid #c47a33;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:900}
@media (max-height:520px){#dock .ic .c{width:52px;height:52px;font-size:26px;border-width:4px}.ic .l{font-size:12px;margin-top:-10px}}

  $('#wsub').style.display='none';$('#wnext').style.display='block';$('#wnext').focus()};
 $('#wsub').onclick=chk;$('#wnext').onclick=openWrong;
 $('#wa').onkeydown=e=>{if(e.key==='Enter'){if($('#wr'))$('#wr').focus();else chk()}};
 if($('#wr'))$('#wr').onkeydown=e=>{if(e.key==='Enter')chk()}}
/* ===== 收藏（減法寶箱開出來的碎片）===== */
const RAR=['','普通','優良','精緻','傳說','神話'],RC=['','#7b8591','#2e9e5b','#2f80ed','#8e3fd1','#e67e00'];
const SUBL=['石刻心臟','卡諾卜罐','滑輪組裝圖','埃及曆法與星座圖','迷宮路線指引','雕像對應圖','黃金聖甲蟲','象形文字組合','密碼鎖','反射鏡使用法'];
function openBag(){const sh=RK().shards||{};const keys=Object.keys(sh).filter(k=>k.startsWith('sub|')).sort((a,b)=>+a.split('|')[1]-+b.split('|')[1]);
 const total=keys.reduce((a,k)=>a+sh[k].n,0);
 openBox(`<h2>🎒 收藏</h2><div class="story">在減法章通關後打開寶箱，就會得到碎片。碎片的稀有度和你破關的星等有關，星等越高越容易開到好碎片！</div>
 ${keys.length?`<div style="margin-top:10px">${keys.map(k=>{const s=sh[k],i=+k.split('|')[1];return`<div class="row"><i>🧩</i><span>第 ${i} 層 ${SUBL[i-1]||''}</span><em style="color:${RC[s.best]}">最高【${RAR[s.best]}】×${s.n}</em></div>`}).join('')}</div><p style="font-size:13px;color:var(--dim)">一共收集了 ${total} 片碎片。</p>`:'<p>還沒有碎片，先去減法章破關開寶箱吧！</p>'}`)}
/* ===== 商店：用勇者幣買東西（目前上架：改名卡）===== */
const SHOP=Object.assign({rename:2000},HC.shop||{});
const GOODS=[{id:'rename',icon:'🪪',name:'改名卡',desc:'名字是勇者的招牌，要想清楚再換喔！（用一次消耗一張）'}];
function openShop(msg){
 const o=RK(),coin=o.coin||0,it=o.items||{};
 openBox(`<h2>🏪 小屋商店</h2><div class="story">🪙 你的勇者幣：<b style="font-size:22px;color:#b86e00">${coin.toLocaleString()}</b><br><small>打完每一場戰鬥都會得到勇者幣，答對越多、模式越難、星星越多賺越多！</small></div>
 ${msg?`<div style="margin:8px 0;font-weight:900;color:${msg[0]==='✅'?'#2e7d32':'#c0392b'}">${msg}</div>`:''}
 ${GOODS.map(g=>{const p=SHOP[g.id],have=it[g.id]||0;return`<div class="row" style="align-items:center"><i style="font-size:30px;margin-right:8px">${g.icon}</i><span><b>${g.name}</b>　<small>擁有 ${have} 張</small><br><small style="color:var(--dim)">${g.desc}</small></span><em style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="sbtn" ${coin<p?'disabled style="opacity:.5"':''} onclick="buy('${g.id}')">🪙 ${p} 購買</button>${have?`<button class="sbtn" style="background:#2e9e5b;box-shadow:0 4px 0 #1d6b3c" onclick="useItem('${g.id}')">使用</button>`:''}</em></div>`}).join('')}
 <p style="font-size:13px;color:var(--dim);margin-top:10px">更多商品（冒險小道具、稱號、造型）陸續上架中～</p>`)}
function buy(id){const o=RK(),p=SHOP[id];if((o.coin||0)<p){openShop(`❌ 勇者幣不夠，還差 ${p-(o.coin||0)} 枚，再去打幾場吧！`);return}
 o.coin-=p;o.items=o.items||{};o.items[id]=(o.items[id]||0)+1;saveRK(o);render();
 if(id==='rename')useItem('rename');else openShop('✅ 購買成功！')}
function useItem(id){if(id==='rename'){if(!((RK().items||{}).rename>0)){openShop('❌ 沒有改名卡');return}askName(false)}}
/* ===== 設定（玩法、教師版、重置）===== */
const TFILES=[['第一章 加法','addition-teacher.html'],['第二章 減法','subtraction-teacher.html'],['第三章 乘法','multiplication-teacher.html'],['第四章 除法','division-teacher.html'],['第五章 四則','four-ops-teacher.html'],['第六章 負數','negative-teacher.html']];
function openTeacherList(){
 openBox(`<h2>👩‍🏫 教師測試版</h2><div class="story">獨立存檔，不會影響學生資料。可以解鎖全部關卡、一鍵通關、設定等級、自動答題、直接過關、直接進入任意關卡。</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">${TFILES.map(([n,f])=>`<button class="big endb" style="margin:0;font-size:16px;padding:12px 4px" onclick="openTeacher('${f}')">${n}</button>`).join('')}</div>`)}
function openTeacher(f){$('#mm').classList.remove('on');$('#fr').src=encodeURI(f);$('#stage').classList.add('on')}
function askTeacher(){if(TEACHER_PASS){const v=prompt('請輸入教師密碼');if(v!==TEACHER_PASS){if(v!==null)alert('密碼不對喔');return}}openTeacherList()}
function openHow(){openBox(`<h2>📜 玩法說明</h2><div class="story">1. 點桌上的<b>冒險地圖</b>（或下面的 🗺️），選一塊島嶼進入那一章，不用照順序。<br>2. 在章節地圖點一個關卡後，再選擇 🎓教學（小老師教你，最高 ⭐2）、⚔️挑戰（最高 ⭐4）或 🔥地獄（最高 ⭐5），三種進度共用。<br>3. 前五章都通關，牆上的勳章架會亮滿，煉成🛡️平衡之神盾，第六章「負數」正式開啟。<br>4. 不知道去哪？看勇者頭上的對話泡泡，或打開 📜今日任務。<br>5. 通關一個大關，遊戲地圖左上角會開啟「♾️無限練習」；整章通關後，冒險地圖也會出現「♾️章節無限模式」。<br>6. 答錯的題目會收集到 📝錯題練習，同一題答對 ${GRAD} 次就畢業。<br>7. 點勇者可以看自己的能力、稱號和冒險紀錄，想改名字要到 🏪商店 買「改名卡」。<br>8. 每場戰鬥結束會得到 🪙勇者幣：答對越多、關卡越後面、模式越難、星星越多，賺得越多；第一次通關還有大獎！</div>`)}
function openGear(){openBox(`<h2>⚙️ 設定</h2><div style="display:grid;gap:10px"><button class="sbtn" onclick="openHow()">📜 玩法說明</button><button class="sbtn" style="background:#4b5563;box-shadow:0 4px 0 #2b3038" onclick="askTeacher()">👩‍🏫 教師測試版</button></div>`)}
/* ===== 綁定 ===== */
$('#heroWrap').onclick=heroCard;$('#lvPill').onclick=heroCard;$('#bubble').onclick=()=>{const r=recommend();if(tipI%TIPS.length===1&&r)openMap();else heroCard()};
$('#mapTableG').onclick=openMap;$('#medals').onclick=heroCard;
$('#icDaily').onclick=openDaily;$('#icMap').onclick=openMap;$('#icBoard').onclick=openBoard;$('#icWrong').onclick=openWrong;$('#icBag').onclick=openBag;$('#icShop').onclick=()=>openShop();
$('#gear').onclick=openGear;$('#coinPill').onclick=()=>openShop();$('#scorePill').onclick=openBoard;
$('#mm').onclick=e=>{if(e.target.id==='mm')shut()};
render();
if(!RK().name)askName(true);
</script></body></html>
